developer_instructions = '''
> 実行環境: Codex サブエージェント（sandbox_mode = "workspace-write"）。Claude 版の `tools:` に当たる
> ツール単位の制限は Codex に無いため、**下記の本文の禁止事項を厳守すること**で同等の境界を保つ
