[project]
name = "sincromisor"
version = "2.0.0"
description = "Sincromisor-2.0.0"
authors = [
    { name = "Akito Miura", email = "phenomer@g.hachune.net" }
]
dependencies = [
    "python-dotenv>=1.2.4",
    "setuptools>=84.2.1",
]

readme = "README.md"
requires-python = ">=3.14,<3.15"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
    "ty>=0.0.91",
    "types-psutil>=7.2.2.20260906",
    "types-pyyaml>=6.0.12.20260906",
    "types-requests>=2.33.0.20261006",
]

full = [
    "speech-extractor",
    "speech-recognizer-nemo",
    "text-processor",
    "voice-synthesizer",
]

speech-extractor = [
    "speech-extractor",
]

speech-recognizer-nemo = [
    "speech-recognizer-nemo",
]

text-processor = [
    "text-processor",
]

voice-synthesizer = [
    "voice-synthesizer",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
default-groups = []
constraint-dependencies = [
    # 推移依存が脆弱性の修正版より古い版へ戻らないよう、下限を指定する。
    "aiohttp>=3.14.5",
    "cryptography>=50.0.0",
    "filelock>=4.2.1",
    "gitpython>=3.1.58",
    "mako>=1.3.12",
    "idna>=3.20",
    "msgpack>=1.2.3",
    "multidict>=7.1.0",
    "onnx>=1.23.2",
    "pillow>=13.0.0",
    "pygments>=2.21.0",
    "pyopenssl>=26.0.0",
    "pyarrow>=26.0.0",
    "requests>=2.34.2",
    "starlette>=1.9.0",
    "urllib3>=2.8.0",
    "werkzeug>=3.1.9",
]

[tool.uv.workspace]
members = [
    "sincromisor-server/sincro-config",
    "sincromisor-server/sincro-models",
    "sincromisor-server/speech-recognizer-nemo",
    "sincromisor-server/speech-extractor",
    "sincromisor-server/voice-synthesizer",
    "sincromisor-server/text-processor",
    "sincromisor-server/sincro-models",
]

[tool.uv.sources]
sincro-config = { workspace = true }
sincro-models = { workspace = true }
speech-extractor = { workspace = true }
speech-recognizer-nemo = { workspace = true }
voice-synthesizer = { workspace = true }
text-processor = { workspace = true }

[tool.ty.src]
include = [
    "sincromisor-server",
    "utils",
]
exclude = [
    "sincromisor-server/**/tests/**",
]

[tool.hatch.build.targets.wheel]
packages = ["sincromisor-server"]

# https://docs.astral.sh/ruff/rules/
[tool.ruff.lint]
extend-select = [
    # isort
    "I",
    # pyupgrade
    "UP",
    # pyflakes
    "F",
    # pycodestyle
    # "E", "W",
    # mccabe
    # "C",
    # flake8-2020
    "YTT",
    # flake8-annotations
    # "ANN",
    # flake8-async
    # "ASYNC",
    # flake8-bandit
    # "S",
    # flake8-boolean-trap
    # "FBT",
    # flake8-bugbear
    # "B",
    # flake8-builtins
    # "A",
    # flake8-commas
    "COM",
    # flake8-blind-except
    # "BLE",
    # flake8-comprehensions
    "C4",
    # flake8-datetimez
    # "DTZ",
    # flake8-debugger
    "T10",
    # flake8-errmsg
    # "EM",
    # flake8-executable
    "EXE",
    # flake8-future-annotations
    "FA",
    # flake8-implicit-str-concat
    "ISC",
    # flake8-import-conventions
    "ICN",
    # flake8-logging
    "LOG",
    # flake8-logging-format
    # "G",
    # flake8-no-pep420
    # "INP",
    # flake8-pie
    "PIE",
    # flake8-print
    # "T20",
    # flake8-pyi
    # "PYI",
    # flake8-pytest-style
    "PT",
    # flake8-quotes
    "Q",
    # flake8-raise
    "RSE",
    # flake8-return
    "RET",
    # flake8-slots
    "SLOT",
    # flake8-simplify
    # "SIM",
    # flake8-tidy-imports
    # "TID",
    # flake8-type-checking
    # "TCH",
    # flake8-gettext
    "INT",
    # flake8-unused-arguments
    # "ARG",
    # flake8-use-pathlib
    # "PTH",
    # flake8-todos
    "TD",
    # flake8-fixme
    "FIX",
    # eradicate
    # "ERA",
    # Error
    "PLE",
    # Refactor
    # "PLR",
    # Warning
    "PLW",
    # tryceratops
    # "TRY",
    # flynt
    "FLY",
    # NumPy-specific rules
    "NPY",
    # FastAPI
    # "FAST",
    # pep8-naming
    # "N",
    # pydocstyle
    # "D",
    # flake8-self
    "SLF",
    # Ruff-specific rules
    # "RUF",
]

ignore = ["ISC001", "COM812"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
