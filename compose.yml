# 標準構成はHTTPとメディアUDPだけを公開する。
# 分散配置では.envのCOMPOSE_FILEでcompose/distributed.ymlを重ねる。
# ホスト側のHTTPS終端・保守接続にはcompose/management.ymlも重ねる。
# 選択例: examples/compose.env / 手順: documents/design/infrastructure/compose.md
# 追加ファイルは環境ごとの選択とするため、以下のincludeには含めない。
include:
    - compose/frontend.yml
    - compose/sincro-rtc.yml
    - compose/speech-extractor.yml
    - compose/speech-recognizer.yml
    - compose/text-processor.yml
    - compose/llama-server.yml
    - compose/voice-synthesizer.yml
    - compose/consul-server.yml
    - compose/s3.yml
    - compose/redis.yml
    # vrm360でLive配信を行いたい場合は、以下のコメントアウトを外す
    # - compose/mediamtx.yml

networks:
    sincromisor-net:
        ipam:
            config:
                - subnet: ${SINCRO_COMPOSE_NETWORK_SUBNET}
