services:
    voice-synthesizer:
        logging: {driver: local, options: {max-size: "20m", max-file: "5"}}
        profiles:
            - full
            - backend
        build:
            context: ..
            dockerfile: ./Docker/voice-synthesizer/Dockerfile
        image: ${SINCRO_REGISTRY_NAME}/voice-synthesizer:latest
        pull_policy: build
        entrypoint: [sh, /with-s3-secret.sh]
        command: [uv, run, --no-sync, voice-synthesizer/VoiceSynthesizerProcess.py]
        volumes:
            - s3-auth:/run/sincromisor-s3-auth:ro
            - ../Docker/service-initializer/with-s3-secret.sh:/with-s3-secret.sh:ro
        networks:
            - sincromisor-net
        environment:
            - SINCRO_LOG_CONVERSATION_ENABLED=${SINCRO_LOG_CONVERSATION_ENABLED-true}
            - SINCRO_SYNTHESIZER_HOST=${SINCRO_SYNTHESIZER_HOST}
            - SINCRO_SYNTHESIZER_PORT=${SINCRO_SYNTHESIZER_PORT}
            - SINCRO_SYNTHESIZER_PUBLIC_BIND_HOST=${SINCRO_SYNTHESIZER_PUBLIC_BIND_HOST}
            - SINCRO_SYNTHESIZER_PUBLIC_BIND_PORT=${SINCRO_SYNTHESIZER_PUBLIC_BIND_PORT}
            - SINCRO_CONSUL_AGENT_HOST=consul-agent-synthesizer
            - SINCRO_CONSUL_AGENT_PORT=8500
            - SINCRO_S3_ACCESS_KEY=${SINCRO_S3_ACCESS_KEY}
            - SINCRO_S3_SECRET_KEY=${SINCRO_S3_SECRET_KEY}
            - SINCRO_SYNTHESIZER_VOICEVOX_DEFAULT_STYLE_ID=${SINCRO_SYNTHESIZER_VOICEVOX_DEFAULT_STYLE_ID}
        deploy:
            restart_policy:
                condition: any
                delay: 10s
        depends_on:
            # バケットと認証の準備を待つ。モデル取得の完了とは独立して扱う。
            s3-bootstrap:
                condition: service_completed_successfully
            consul-agent-synthesizer:
                condition: service_healthy
            sincro-voicevox:
                condition: service_healthy
            sincro-s3:
                condition: service_healthy
        healthcheck:
            test:
                [
                    "CMD",
                    "curl",
                    "http://localhost:8005/api/v1/VoiceSynthesizer/statuses",
                ]
            interval: 10s
            timeout: 5s
            retries: 15

    sincro-voicevox:
        logging: {driver: local, options: {max-size: "20m", max-file: "5"}}
        profiles:
            - full
            - backend
        image: ${SINCRO_REGISTRY_NAME}/voicevox:latest
        pull_policy: build
        build:
            context: ..
            dockerfile: ./Docker/voicevox/Dockerfile
        networks:
            - sincromisor-net
        environment:
            - SINCRO_VOICEVOX_HOST=${SINCRO_VOICEVOX_HOST}
            - SINCRO_VOICEVOX_PORT=${SINCRO_VOICEVOX_PORT}
            - SINCRO_CONSUL_AGENT_HOST=consul-agent-synthesizer
            - SINCRO_CONSUL_AGENT_PORT=8500
        deploy:
            restart_policy:
                condition: any
                delay: 10s
        depends_on:
            consul-agent-synthesizer:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "curl", "http://localhost:50021/version"]
            interval: 10s
            timeout: 5s
            retries: 5

    consul-agent-synthesizer:
        logging: {driver: local, options: {max-size: "20m", max-file: "5"}}
        profiles:
            - full
            - backend
        image: hashicorp/consul:latest
        command:
            [
                "agent",
                "-retry-join=${SINCRO_CONSUL_SERVER_HOST}:8301",
                "-advertise=${SINCRO_CONSUL_ADVERTISE_ADDR:-}",
                "-serf-lan-port=8316",
                "-client=0.0.0.0",
            ]
        volumes:
            - consul-agent-synthesizer-data:/consul/data
        networks:
            - sincromisor-net
        deploy:
            restart_policy:
                condition: any
                delay: 10s
        healthcheck:
            test: ["CMD", "consul", "members"]
            interval: 10s
            timeout: 5s
            retries: 5

volumes:
    consul-agent-synthesizer-data:

networks:
    sincromisor-net:
