services:
    text-processor:
        logging: {driver: journald, options: {mode: non-blocking, max-buffer-size: "4m", labels: "com.docker.compose.project,com.docker.compose.service"}}
        profiles:
            - full
            - backend
        build:
            context: ..
            dockerfile: ./Docker/text-processor/Dockerfile
        image: ${SINCRO_REGISTRY_NAME}/text-processor:latest
        pull_policy: build
        entrypoint: [sh, /with-token.sh]
        command: [uv, run, --no-sync, text-processor/TextProcessorProcess.py]
        volumes:
            - service-auth:/run/sincromisor-auth:ro
            - ../Docker/service-initializer/with-token.sh:/with-token.sh:ro
        networks:
            - sincromisor-net
        environment:
            - SINCRO_LOG_CONVERSATION_ENABLED=${SINCRO_LOG_CONVERSATION_ENABLED-true}
            - SINCRO_PROCESSOR_HOST=${SINCRO_PROCESSOR_HOST}
            - SINCRO_PROCESSOR_PORT=${SINCRO_PROCESSOR_PORT}
            - SINCRO_PROCESSOR_PUBLIC_BIND_HOST=${SINCRO_PROCESSOR_PUBLIC_BIND_HOST}
            - SINCRO_PROCESSOR_PUBLIC_BIND_PORT=${SINCRO_PROCESSOR_PUBLIC_BIND_PORT}
            - SINCRO_CONSUL_AGENT_HOST=consul-agent-processor
            - SINCRO_CONSUL_AGENT_PORT=8500
            - SINCRO_PROCESSOR_MASTRA_URL=${SINCRO_PROCESSOR_MASTRA_URL}
            - SINCRO_PROCESSOR_MASTRA_TOKEN=${SINCRO_PROCESSOR_MASTRA_TOKEN:-${SINCRO_AGENT_ADMIN_TOKEN}}
            - SINCRO_PROCESSOR_MASTRA_AGENT_ID=${SINCRO_PROCESSOR_MASTRA_AGENT_ID}
        deploy:
            restart_policy:
                condition: any
                delay: 10s
        depends_on:
            service-initializer:
                condition: service_completed_successfully
            consul-agent-processor:
                condition: service_healthy
        healthcheck:
            test:
                [
                    "CMD",
                    "curl",
                    "http://localhost:8004/api/v1/TextProcessor/statuses",
                ]
            interval: 10s
            timeout: 5s
            retries: 15

    consul-agent-processor:
        logging: {driver: journald, options: {mode: non-blocking, max-buffer-size: "4m", labels: "com.docker.compose.project,com.docker.compose.service"}}
        profiles:
            - full
            - backend
        image: hashicorp/consul:latest
        command:
            [
                "agent",
                "-retry-join=${SINCRO_CONSUL_SERVER_HOST}:8301",
                "-advertise=${SINCRO_CONSUL_ADVERTISE_ADDR:-}",
                "-serf-lan-port=8315",
                "-client=0.0.0.0",
            ]
        volumes:
            - consul-agent-processor-data:/consul/data
        networks:
            - sincromisor-net
        deploy:
            restart_policy:
                condition: any
                delay: 10s
        healthcheck:
            test: ["CMD", "consul", "members"]
            interval: 10s
            timeout: 5s
            retries: 5

volumes:
    consul-agent-processor-data:

networks:
    sincromisor-net:
