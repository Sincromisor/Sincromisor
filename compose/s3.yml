services:
    seaweed-master:
        logging: {driver: local, options: {max-size: "20m", max-file: "5"}}
        profiles:
            - full
            - backend
            - external
            - s3
        image: chrislusf/seaweedfs
        command: 'master -ip=seaweed-master -ip.bind=0.0.0.0 -metricsPort=9324'
        volumes:
            - ../Docker/seaweedfs/healthcheck.sh:/healthcheck.sh:ro
            - sincro-s3-master-data:/data
        networks:
            - s3-internal-net
        deploy:
            restart_policy:
                condition: any
                delay: 10s
        depends_on:
            consul-agent-s3:
                condition: service_healthy
        healthcheck:
            test: [CMD, sh, /healthcheck.sh, "http://127.0.0.1:9333/"]
            interval: 5s
            timeout: 3s
            retries: 30

    seaweed-volume:
        logging: {driver: local, options: {max-size: "20m", max-file: "5"}}
        profiles:
            - full
            - backend
            - external
            - s3
        image: chrislusf/seaweedfs
        command: 'volume -ip=seaweed-volume -master="seaweed-master:9333" -ip.bind=0.0.0.0 -port=8080 -metricsPort=9325'
        volumes:
            - ../Docker/seaweedfs/healthcheck.sh:/healthcheck.sh:ro
            - sincro-s3-data:/data
        networks:
            - s3-internal-net
        deploy:
            restart_policy:
                condition: any
                delay: 10s
        depends_on:
            seaweed-master:
                condition: service_healthy
            consul-agent-s3:
                condition: service_healthy
        healthcheck:
            test: [CMD, sh, /healthcheck.sh, "http://127.0.0.1:8080/status"]
            interval: 5s
            timeout: 3s
            retries: 30

    seaweed-filer:
        logging: {driver: local, options: {max-size: "20m", max-file: "5"}}
        profiles:
            - full
            - backend
            - external
            - s3
        image: chrislusf/seaweedfs
        command: 'filer -ip=seaweed-filer -master="seaweed-master:9333" -ip.bind=0.0.0.0 -metricsPort=9326'
        # オブジェクトの場所と認証設定をdown/up後も同じ領域から読み込む。
        volumes:
            - ../Docker/seaweedfs/healthcheck.sh:/healthcheck.sh:ro
            - sincro-s3-filer-data:/data
        tty: true
        stdin_open: true
        networks:
            - s3-internal-net
        deploy:
            restart_policy:
                condition: any
                delay: 10s
        depends_on:
            consul-agent-s3:
                condition: service_healthy
            seaweed-master:
                condition: service_healthy
            seaweed-volume:
                condition: service_healthy
        healthcheck:
            test: [CMD, sh, /healthcheck.sh, "http://127.0.0.1:8888/"]
            interval: 5s
            timeout: 3s
            retries: 30

    sincro-s3:
        logging: {driver: local, options: {max-size: "20m", max-file: "5"}}
        profiles:
            - full
            - backend
            - external
            - s3
        image: chrislusf/seaweedfs
        command: 's3 -filer="seaweed-filer:8888" -ip.bind=0.0.0.0 -metricsPort=9327'
        volumes:
            - ../Docker/seaweedfs/healthcheck.sh:/healthcheck.sh:ro
        networks:
            - s3-internal-net
            - sincromisor-net
        deploy:
            restart_policy:
                condition: any
                delay: 10s
        depends_on:
            seaweed-master:
                condition: service_healthy
            seaweed-volume:
                condition: service_healthy
            seaweed-filer:
                condition: service_healthy
        healthcheck:
            test: [CMD, sh, /healthcheck.sh, "http://127.0.0.1:${SINCRO_S3_PUBLIC_BIND_PORT}/status"]
            interval: 5s
            timeout: 3s
            retries: 30

    consul-agent-s3:
        logging: {driver: local, options: {max-size: "20m", max-file: "5"}}
        profiles:
            - full
            - backend
            - external
            - s3
        image: hashicorp/consul:latest
        command:
            [
                "agent",
                "-retry-join=${SINCRO_CONSUL_SERVER_HOST}:8301",
                "-advertise=${SINCRO_CONSUL_ADVERTISE_ADDR:-}",
                "-serf-lan-port=8318",
                "-client=0.0.0.0",
            ]
        volumes:
            - consul-agent-s3-data:/consul/data
        networks:
            - sincromisor-net
        deploy:
            restart_policy:
                condition: any
                delay: 10s
        healthcheck:
            test: ["CMD", "consul", "members"]
            interval: 10s
            timeout: 5s
            retries: 5

    consul-s3-registrar:
        logging: {driver: local, options: {max-size: "20m", max-file: "5"}}
        profiles:
            - full
            - backend
            - external
            - s3
        image: curlimages/curl:latest
        networks:
            - sincromisor-net
        depends_on:
            consul-agent-s3:
                condition: service_healthy
            sincro-s3:
                condition: service_healthy
        environment:
            - CONSUL_HTTP_ADDR=http://consul-agent-s3:8500
            - SERVICE_NAME=SincroS3
            - SERVICE_ID=seaweed-s3
            - SERVICE_ADDRESS=sincro-s3
            - SERVICE_PORT=${SINCRO_S3_PUBLIC_BIND_PORT}
            - SERVICE_TAGS=s3,seaweedfs,tts-cache
            - PERIOD_SECONDS=15
        volumes:
            - ../Docker/seaweedfs/consul-registrar.sh:/consul-registrar.sh:ro
        entrypoint: ["/bin/sh", "/consul-registrar.sh"]
        restart: unless-stopped

    s3-bootstrap:
        logging: {driver: local, options: {max-size: "20m", max-file: "5"}}
        profiles:
            - full
            - backend
            - external
            - s3
        image: chrislusf/seaweedfs:latest
        networks:
            - s3-internal-net
        depends_on:
            s3-credential-initializer:
                condition: service_completed_successfully
            sincro-s3:
                condition: service_healthy
        environment:
            - S3_BUCKETS=speech-recognizer,voice-synthesizer
            - S3_USER=sincromisor
            - S3_ACCESS_KEY=${SINCRO_S3_ACCESS_KEY}
            - S3_SECRET_KEY=${SINCRO_S3_SECRET_KEY}
            - S3_ACTIONS=Read,Write,List
        volumes:
            - ../Docker/seaweedfs/s3-bootstrap.sh:/s3-bootstrap.sh:ro
            - s3-auth:/run/sincromisor-s3-auth:ro
            - ../Docker/service-initializer/with-s3-secret.sh:/with-s3-secret.sh:ro
        entrypoint: [sh, /with-s3-secret.sh]
        command: [sh, /s3-bootstrap.sh]
        restart: "no"

volumes:
    consul-agent-s3-data:
    sincro-s3-data:
    sincro-s3-master-data:
    sincro-s3-filer-data:

networks:
    sincromisor-net:
    s3-internal-net:
        internal: true
