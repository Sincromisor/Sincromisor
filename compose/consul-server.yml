services:
    sincro-consul-server:
        logging: {driver: local, options: {max-size: "20m", max-file: "5"}}
        profiles:
            - full
            - backend
            - external
        image: hashicorp/consul:latest
        # 単一サーバーの検証環境では長期停止を許容する。複数サーバーでは標準の168hへ戻す。
        command:
            [
                "agent",
                "-server",
                "-node=${SINCRO_CONSUL_SERVER_NODE_NAME}",
                "-bootstrap-expect=1",
                '-hcl=server_rejoin_age_max = "${SINCRO_CONSUL_SERVER_REJOIN_AGE_MAX:-87600h}"',
                "-advertise=${SINCRO_CONSUL_ADVERTISE_ADDR:-}",
                "-ui",
                "-client=0.0.0.0",
            ]
        volumes:
            - consul-server-data:/consul/data
        networks:
            - sincromisor-net
        deploy:
            restart_policy:
                condition: any
                delay: 10s
        healthcheck:
            test: ["CMD", "consul", "members"]
            interval: 10s
            timeout: 5s
            retries: 5

    bandog:
        logging: {driver: local, options: {max-size: "20m", max-file: "5"}}
        profiles:
            - full
            - backend
            - external
        image: hashicorp/consul:latest
        networks:
            - sincromisor-net
        volumes:
            - ../Docker/consul/bandog.sh:/bandog.sh:ro
        command: ["/bin/sh", "/bandog.sh"]
        environment:
            - CONSUL_DNS_ADDR=${SINCRO_CONSUL_SERVER_HOST}:8600
        deploy:
            restart_policy:
                condition: any
                delay: 10s
        healthcheck:
            test: ["CMD-SHELL", "test $(cat services.status) = 0"]
            interval: 3s
            timeout: 1s

networks:
    sincromisor-net:

volumes:
    consul-server-data:
