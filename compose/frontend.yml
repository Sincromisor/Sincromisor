services:
    sincro-frontend:
        profiles:
            - full
            - frontend
        build:
            context: ..
            dockerfile: ./Docker/sincro-frontend/Dockerfile
        image: ${SINCRO_REGISTRY_NAME}/sincro-frontend:latest
        pull_policy: build
        ports:
            - 8086:80/tcp
        volumes:
            - ../configs/Caddyfile:/etc/caddy/Caddyfile:ro
        networks:
            - sincromisor-net
        environment:
            - SINCRO_CONSUL_AGENT_HOST=consul-agent-frontend
            - SINCRO_CONSUL_AGENT_PORT=8500
        deploy:
            restart_policy:
                condition: any
                delay: 10s
        depends_on:
            consul-agent-frontend:
                condition: service_healthy
        healthcheck:
            test:
                [
                    "CMD",
                    "wget",
                    "-q",
                    "-O-",
                    "http://localhost/api/v1/Frontend/statuses",
                ]
            interval: 10s
            timeout: 5s
            retries: 5

    consul-agent-frontend:
        profiles:
            - full
            - frontend
        image: hashicorp/consul:latest
        command:
            [
                "agent",
                "-retry-join=${SINCRO_CONSUL_SERVER_HOST}:8301",
                "-advertise=${SINCRO_CONSUL_ADVERTISE_ADDR:-}",
                "-serf-lan-port=8312",
                "-client=0.0.0.0",
            ]
        volumes:
            - consul-agent-frontend-data:/consul/data
        networks:
            - sincromisor-net
        deploy:
            restart_policy:
                condition: any
                delay: 10s
        healthcheck:
            test: ["CMD", "consul", "members"]
            interval: 10s
            timeout: 5s
            retries: 5

volumes:
    consul-agent-frontend-data:

networks:
    sincromisor-net:
