# 初期化コンテナが取得・検証した会話用モデルを読み込む。
services:
    llama-server:
        logging: {driver: local, options: {max-size: "20m", max-file: "5"}}
        profiles: [chat]
        restart: unless-stopped
        image: ${SINCRO_LLAMA_IMAGE:-ghcr.io/ggml-org/llama.cpp@sha256:92f75345eeeffa2e76e0e47526f310d0aca36b523bfe514a7dfda5bb1185f256}
        command:
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            - --model
            - /models/${SINCRO_LLAMA_MODEL_FILE:-gemma-4-E2B-it-Q4_0.gguf}
            - --alias
            - gemma-4-E2B-it
            - --ctx-size
            - ${SINCRO_LLAMA_CTX_SIZE:-4096}
            - --threads
            - ${SINCRO_LLAMA_THREADS:-6}
            - --n-gpu-layers
            - "99"
            - --parallel
            - "1"
            - --jinja
            - --reasoning
            - "off"
        volumes:
            # 取得処理だけに書込みを許可し、推論時は読み取り専用にする。
            - type: bind
              source: ${SINCRO_LLAMA_MODEL_DIR:-../volumes/llama-models}
              target: /models
              read_only: true
              bind:
                  create_host_path: true
        depends_on:
            llama-model-initializer:
                condition: service_completed_successfully
        deploy:
            resources:
                reservations:
                    devices:
                        - driver: nvidia
                          count: 1
                          capabilities: [gpu]
        networks: [sincromisor-net]
        healthcheck:
            # 採用イメージに含まれるcurlで、モデルのロード中は失敗させる。
            test: [CMD, curl, --fail, --silent, http://localhost:8080/health]
            start_period: 120s
            interval: 10s
            timeout: 5s
            retries: 12

networks:
    sincromisor-net:
