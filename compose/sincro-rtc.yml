include:
    - initializer.yml

services:
    sincro-rtc:
        profiles:
            - full
            - rtc
        build:
            context: ..
            dockerfile: ./Docker/sincro-rtc/Dockerfile
        image: ${SINCRO_REGISTRY_NAME}/sincro-rtc:latest
        ports:
            - 8001:8001/tcp
        volumes:
            []
            # - ../configs/config.yml:/opt/sincromisor/configs/config.yml:ro
        networks:
            - sincromisor-net
        environment:
            - SINCRO_RTC_HOST=${SINCRO_RTC_HOST}
            - SINCRO_RTC_PORT=${SINCRO_RTC_PORT}
            - SINCRO_RTC_PUBLIC_BIND_HOST=${SINCRO_RTC_PUBLIC_BIND_HOST}
            - SINCRO_RTC_PUBLIC_BIND_PORT=${SINCRO_RTC_PUBLIC_BIND_PORT}
            - SINCRO_CONSUL_AGENT_HOST=${SINCRO_CONSUL_AGENT_HOST:-consul-agent-rtc}
            - SINCRO_CONSUL_AGENT_PORT=8500
            - SINCRO_RTC_FORWARDED_ALLOW_IPS=${SINCRO_RTC_FORWARDED_ALLOW_IPS}
            - SINCRO_RTC_MAX_SESSIONS=${SINCRO_RTC_MAX_SESSIONS}
            - SINCRO_RTC_FALLBACK_HOST=${SINCRO_RTC_FALLBACK_HOST}
            - SINCRO_RTC_FALLBACK_PORT=${SINCRO_RTC_FALLBACK_PORT}
        deploy:
            restart_policy:
                condition: any
                delay: 10s
        depends_on:
            service-initializer:
                condition: service_completed_successfully
            consul-agent-rtc:
                condition: service_healthy
        healthcheck:
            test:
                [
                    "CMD",
                    "curl",
                    "http://localhost:8001/api/v1/RTCSignalingServer/statuses",
                ]
            interval: 10s
            timeout: 5s
            retries: 15

    sincro-rtc-pion:
        profiles:
            - pion
        build:
            context: ..
            dockerfile: ./Docker/sincro-rtc-pion-poc/Dockerfile
        image: ${SINCRO_REGISTRY_NAME}/sincro-rtc-pion-poc:latest
        command:
            [
                "--http",
                "0.0.0.0:8001",
                "--frontend-dir",
                "/opt/sincromisor/frontend",
                "--ffmpeg",
                "${SINCRO_PION_FFMPEG_PATH}",
                "--stun",
                "${SINCRO_PION_STUN}",
                "--media-udp",
                "${SINCRO_PION_CONTAINER_IPV4}:${SINCRO_PION_MEDIA_UDP_PORT}",
                "--public-ipv4",
                "${SINCRO_PION_PUBLIC_IPV4}",
                "--interface",
                "${SINCRO_PION_INTERFACE}",
                "--max-sessions",
                "${SINCRO_RTC_MAX_SESSIONS}",
                "--consul-agent-host",
                "${SINCRO_PION_CONSUL_HTTP_HOST}",
                "--consul-agent-port",
                "${SINCRO_PION_CONSUL_HTTP_PORT}",
                "--service-bind-host",
                "${SINCRO_PION_SERVICE_BIND_HOST}",
            ]
        ports:
            - 8001:8001/tcp
            - ${SINCRO_PION_MEDIA_UDP_PORT}:${SINCRO_PION_MEDIA_UDP_PORT}/udp
        networks:
            sincromisor-net:
                ipv4_address: ${SINCRO_PION_CONTAINER_IPV4}
        deploy:
            restart_policy:
                condition: any
                delay: 10s
        healthcheck:
            test:
                [
                    "CMD",
                    "curl",
                    "--fail",
                    "--silent",
                    "--show-error",
                    "http://127.0.0.1:8001/health/ready",
                ]
            interval: 10s
            timeout: 5s
            retries: 15

    consul-agent-rtc:
        profiles:
            - full
            - rtc
        image: hashicorp/consul:latest
        command:
            [
                "agent",
                "-retry-join=${SINCRO_CONSUL_SERVER_HOST}",
                "-client=0.0.0.0",
            ]
        volumes:
            - consul-agent-rtc-data:/consul/data
        networks:
            - sincromisor-net
        deploy:
            restart_policy:
                condition: any
                delay: 10s
        healthcheck:
            test: ["CMD", "consul", "members"]
            interval: 10s
            timeout: 5s
            retries: 5

volumes:
    consul-agent-rtc-data:

networks:
    sincromisor-net:
