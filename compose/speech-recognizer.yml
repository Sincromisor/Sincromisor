services:
    speech-recognizer:
        profiles:
            - full
            - backend
        build:
            context: ..
            dockerfile: ./Docker/speech-recognizer-nemo/Dockerfile
            args:
                SINCRO_RECOGNIZER_MODEL: ${SINCRO_RECOGNIZER_MODEL:?nemoを指定してください}
        image: ${SINCRO_REGISTRY_NAME}/speech-recognizer-${SINCRO_RECOGNIZER_MODEL}:latest
        ports:
            - 8003:8003/tcp
        volumes:
            # UID 1001の既存キャッシュを再利用し、未準備ディレクトリをroot所有で作らせない。
            - type: bind
              source: ../volumes/sincro-cache
              target: /opt/sincromisor/.cache
              bind:
                  create_host_path: false
            - ../volumes/proper-noun-dictionaries:/opt/sincromisor/proper-noun-dictionaries:ro
        networks:
            - sincromisor-net
        environment:
            - SINCRO_RECOGNIZER_HOST=${SINCRO_RECOGNIZER_HOST}
            - SINCRO_RECOGNIZER_PORT=${SINCRO_RECOGNIZER_PORT}
            - SINCRO_RECOGNIZER_PUBLIC_BIND_HOST=${SINCRO_RECOGNIZER_PUBLIC_BIND_HOST}
            - SINCRO_RECOGNIZER_PUBLIC_BIND_PORT=${SINCRO_RECOGNIZER_PUBLIC_BIND_PORT}
            - SINCRO_CONSUL_AGENT_HOST=consul-agent-recognizer
            - SINCRO_CONSUL_AGENT_PORT=8500
            - SINCRO_S3_ACCESS_KEY=${SINCRO_S3_ACCESS_KEY}
            - SINCRO_S3_SECRET_KEY=${SINCRO_S3_SECRET_KEY}
            - SINCRO_RECOGNIZER_VOICE_LOG_DIR=${SINCRO_RECOGNIZER_VOICE_LOG_DIR}
            - SINCRO_RECOGNIZER_PROPER_NOUN_ENABLE=${SINCRO_RECOGNIZER_PROPER_NOUN_ENABLE}
            - SINCRO_RECOGNIZER_PROPER_NOUN_DICT_PATH=${SINCRO_RECOGNIZER_PROPER_NOUN_DICT_PATH}
            - SINCRO_RECOGNIZER_PROPER_NOUN_CONTEXT_BIASING_ENABLE=${SINCRO_RECOGNIZER_PROPER_NOUN_CONTEXT_BIASING_ENABLE}
            - SINCRO_RECOGNIZER_PROPER_NOUN_CONTEXT_BIASING_BEAM_SIZE=${SINCRO_RECOGNIZER_PROPER_NOUN_CONTEXT_BIASING_BEAM_SIZE}
            - SINCRO_RECOGNIZER_PROPER_NOUN_NBEST_ENABLE=${SINCRO_RECOGNIZER_PROPER_NOUN_NBEST_ENABLE}
            - SINCRO_RECOGNIZER_PROPER_NOUN_NBEST_BEAM_SIZE=${SINCRO_RECOGNIZER_PROPER_NOUN_NBEST_BEAM_SIZE}
        deploy:
            restart_policy:
                condition: any
                delay: 10s
            resources:
                reservations:
                    devices:
                        - driver: nvidia
                          count: all
                          capabilities: [gpu]
        depends_on:
            # バケットと認証の準備を待つ。モデル取得の完了とは独立して扱う。
            s3-bootstrap:
                condition: service_completed_successfully
            consul-agent-recognizer:
                condition: service_healthy
        healthcheck:
            test:
                [
                    "CMD",
                    "curl",
                    "http://localhost:8003/api/v1/SpeechRecognizer/statuses",
                ]
            start_period: 60s
            interval: 10s
            timeout: 5s
            retries: 15

    consul-agent-recognizer:
        profiles:
            - full
            - backend
        image: hashicorp/consul:latest
        command:
            [
                "agent",
                "-retry-join=${SINCRO_CONSUL_SERVER_HOST}:8301",
                "-advertise=${SINCRO_CONSUL_ADVERTISE_ADDR:-}",
                "-serf-lan-port=8314",
                "-client=0.0.0.0",
            ]
        ports:
            - ${SINCRO_CONSUL_PUBLISH_HOST:-127.0.0.1}:8314:8314/tcp
            - ${SINCRO_CONSUL_PUBLISH_HOST:-127.0.0.1}:8314:8314/udp
        volumes:
            - consul-agent-recognizer-data:/consul/data
        networks:
            - sincromisor-net
        deploy:
            restart_policy:
                condition: any
                delay: 10s
        healthcheck:
            test: ["CMD", "consul", "members"]
            interval: 10s
            timeout: 5s
            retries: 5

volumes:
    consul-agent-recognizer-data:

networks:
    sincromisor-net:
