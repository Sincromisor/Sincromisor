services:
    agent-server:
        logging: {driver: local, options: {max-size: "20m", max-file: "5"}}
        profiles: [chat]
        build:
            context: ../sincromisor-server/agent-server
            dockerfile: ../../Docker/agent-server/Dockerfile
        image: ${SINCRO_REGISTRY_NAME}/agent-server:latest
        pull_policy: build
        restart: unless-stopped
        entrypoint: [sh, /with-token.sh]
        command: [node, .mastra/output/index.mjs]
        environment:
            SINCRO_AGENT_ADMIN_TOKEN: ${SINCRO_AGENT_ADMIN_TOKEN:-}
            SINCRO_AGENT_LLM_URL: ${SINCRO_AGENT_LLM_URL:-http://llama-server:8080/v1}
            SINCRO_AGENT_LLM_MODEL: ${SINCRO_AGENT_LLM_MODEL:-gemma-4-E2B-it}
            SINCRO_AGENT_DB_URL: file:/data/mastra.db
        ports: ["127.0.0.1:4111:4111"]
        volumes:
            - agent-data:/data
            - service-auth:/run/sincromisor-auth:ro
            - ../Docker/service-initializer/with-token.sh:/with-token.sh:ro
        networks: [sincromisor-net]
        depends_on:
            consul-agent-chat:
                condition: service_healthy
            service-initializer:
                condition: service_completed_successfully
            llama-server:
                condition: service_healthy
        healthcheck:
            # 実行イメージ内のNodeで、認証付きのAPI起動確認を行う。トークンは出力しない。
            test: [CMD, sh, /with-token.sh, node, -e, "fetch('http://localhost:4111/api/agents',{headers:{Authorization:'Bearer '+process.env.SINCRO_AGENT_ADMIN_TOKEN}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
            start_period: 30s
            interval: 10s
            timeout: 5s
            retries: 6

    # 登録を設定ファイルで維持し、Consulやアプリの再起動順に依存させない。
    consul-agent-chat:
        logging: {driver: local, options: {max-size: "20m", max-file: "5"}}
        profiles: [chat]
        image: hashicorp/consul:latest
        restart: unless-stopped
        command:
            - agent
            - -retry-join=${SINCRO_CONSUL_SERVER_HOST}:8301
            - -advertise=${SINCRO_CONSUL_ADVERTISE_ADDR:-}
            - -serf-lan-port=8319
            - -client=0.0.0.0
        volumes:
            - consul-agent-chat-data:/consul/data
            - ../Docker/agent-server/consul-service.json:/consul/config/agent-server.json:ro
            # モデルロード中の503も検知し、停止後も登録を保持して復旧を追跡する。
            - ../Docker/agent-server/consul-llama-service.json:/consul/config/llama-server.json:ro
        networks: [sincromisor-net]
        healthcheck:
            test: [CMD, consul, members]
            interval: 10s
            timeout: 5s
            retries: 5

volumes:
    agent-data:
    consul-agent-chat-data:

networks:
    sincromisor-net:
