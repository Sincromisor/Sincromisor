[[tests]]
name = "JSON本文の偽装を防ぎ、認証属性を除去する"
[[tests.inputs]]
insert_at = "normalize"
type = "log"
[tests.inputs.log_fields]
message = '{"message":"日本語 Bearer fixture-secret","host":"forged","service":"forged","level":"INFO","session_id":"session","token":"secret","nested":{"private_key":"secret","count":2}}'
timestamp = "2026-09-22T00:00:00Z"
container_id = "container"
stream = "stdout"
[tests.inputs.log_fields.label]
"com.docker.compose.project" = "fixture"
"com.docker.compose.service" = "fixture"
[[tests.outputs]]
extract_from = "normalize"
[[tests.outputs.conditions]]
type = "vrl"
source = '''
assert_eq!(.host, "fixture")
assert_eq!(.service, "fixture")
assert_eq!(.project, "fixture")
assert_eq!(.message, "日本語 Bearer [REDACTED]")
assert_eq!(.level, "info")
assert_eq!(.session_id, "session")
assert!(!exists(.token))
assert!(!exists(.nested.private_key))
assert_eq!(.nested.count, 2)
'''

[[tests]]
name = "解析不能な本文とstderrの重大度を保持する"
[[tests.inputs]]
insert_at = "normalize"
type = "log"
[tests.inputs.log_fields]
message = "例外の続き\n  人工スタック"
timestamp = "2026-09-22T00:00:00Z"
stream = "stderr"
[[tests.outputs]]
extract_from = "normalize"
[[tests.outputs.conditions]]
type = "vrl"
source = '''
assert_eq!(.message, "例外の続き\n  人工スタック")
assert_eq!(.level, "unknown")
assert_eq!(.stream, "stderr")
'''

[[tests]]
name = "構造付きテキストの本文・重大度・発生時刻を取り出す"
[[tests.inputs]]
insert_at = "normalize"
type = "log"
[tests.inputs.log_fields]
message = 'time=2026-09-22T00:00:00Z level=ERROR msg="人工失敗"'
timestamp = "2026-09-22T00:00:01Z"
[[tests.outputs]]
extract_from = "normalize"
[[tests.outputs.conditions]]
type = "vrl"
source = '''
assert_eq!(.message, "人工失敗")
assert_eq!(.level, "error")
assert_eq!(.timestamp, t'2026-09-22T00:00:00Z')
'''

[[tests]]
name = "VOICEVOX本文を無効時に別属性にも残さない"
[[tests.inputs]]
insert_at = "normalize"
type = "log"
[tests.inputs.log_fields]
message = 'INFO:     127.0.0.1:52298 - "POST /audio_query?speaker=3&text=%E4%BA%BA%E5%B7%A5%E6%9C%AC%E6%96%87621 HTTP/1.1" 200 OK'
timestamp = "2026-09-22T00:00:00Z"
container_id = "voicevox-container"
stream = "stdout"
[tests.inputs.log_fields.label]
"com.docker.compose.project" = "fixture"
"com.docker.compose.service" = "sincro-voicevox"
[[tests.outputs]]
extract_from = "normalize"
[[tests.outputs.conditions]]
type = "vrl"
source = '''
if (get_env_var("SINCRO_LOG_SYNTHESIS_ENABLED") ?? "true") == "false" {
    assert_eq!(.message, "VOICEVOX event")
    assert_eq!(.http_status, 200)
    assert!(!contains(encode_json(.), "%E4%BA%BA"))
} else {
    assert!(contains(string!(.message), "%E4%BA%BA"))
}
assert_eq!(.container_id, "voicevox-container")
assert_eq!(.service, "sincro-voicevox")
'''
