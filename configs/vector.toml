# 管理対象Composeのjournal原本とVector内部ログを取り込み、中央停止中は専用ディスクへ保持する。
data_dir = "/var/lib/vector"

[api]
enabled = true
address = "0.0.0.0:8686"

# 両journalをnativeの既定探索で読む。入力名を維持しvector-data内のcursorを再利用する。
[sources.host_journal]
type = "journald"
extra_args = ["--merge"]
current_boot_only = false
since_now = false
emit_cursor = true
remap_priority = false
[sources.host_journal.include_matches]
COM_DOCKER_COMPOSE_PROJECT = ["${SINCRO_LOG_PROJECT}"]

[sources.metrics]
type = "internal_metrics"

# Dockerが付けたjournal属性を既存の正規化境界へ渡す。本文の偽装値は採用しない。
[transforms.container_journal]
type = "remap"
inputs = ["host_journal"]
drop_on_abort = true
source = '''
if .COM_DOCKER_COMPOSE_PROJECT != get_env_var!("SINCRO_LOG_PROJECT") || !exists(.CONTAINER_ID_FULL) { abort }
stream = if .PRIORITY == "3" { "stderr" } else { "stdout" }
. = {"message": .message, "timestamp": .timestamp, "container_id": .CONTAINER_ID_FULL,
     "label": {"com.docker.compose.project": .COM_DOCKER_COMPOSE_PROJECT,
               "com.docker.compose.service": .COM_DOCKER_COMPOSE_SERVICE},
     "stream": stream,
     "journal_cursor": .__CURSOR, "journal_boot_id": ._BOOT_ID,
     "partial_message": .CONTAINER_PARTIAL_MESSAGE}
'''

[transforms.normalize]
type = "remap"
inputs = ["container_journal"]
source = '''
# 識別子は収集元を正とし、本文が偽装した値を採用しない。
original = .
parsed, json_error = parse_json(string!(.message))
err = json_error
if json_error != null { parsed, err = parse_logfmt(string!(.message)) }
if err == null && is_object(parsed) { . = merge(., object!(parsed)) }
.host = get_env_var!("SINCRO_LOG_HOST")
.project = string(original.label."com.docker.compose.project") ?? get_env_var!("SINCRO_LOG_PROJECT")
.service = original.label."com.docker.compose.service"
.container_id = original.container_id
.stream = original.stream
.journal_cursor = original.journal_cursor
.journal_boot_id = original.journal_boot_id
.partial_message = original.partial_message
.observed_at = now()
.timestamp = parse_timestamp(parsed.timestamp, format: "%+") ?? parse_timestamp(parsed.time, format: "%+") ?? original.timestamp
.message = string(parsed.message) ?? string(parsed.msg) ?? string(original.message) ?? ""
if json_error == null && is_object(parsed) {
    .message = string(parsed.message) ?? string(parsed.msg) ?? string(parsed.event) ?? "structured event"
}
.level = downcase(string(.level) ?? string(original.metadata.level) ?? "unknown")
if .level == "warning" { .level = "warn" }
.event = string(.event) ?? "log"
# VOICEVOXの固定版には本文の抑止設定がない。無効時は別項目にも原本を複製しない。
# 不正値も安全側へ倒す。設定値自体の厳密な拒否はPythonサービス起動時に行う。
if .service == "sincro-voicevox" && (get_env_var("SINCRO_LOG_SYNTHESIS_ENABLED") ?? "true") != "true" {
    http, http_error = parse_regex(string!(original.message), r'"(?P<method>GET|POST|PUT|DELETE) (?P<path>/[a-z_]+)(?:\?[^ ]*)? HTTP/[0-9.]+" (?P<status>[0-9]{3})')
    . = {"timestamp": .timestamp, "observed_at": .observed_at, "host": .host, "project": .project,
         "service": .service, "container_id": .container_id, "stream": .stream, "level": .level,
         "event": "voicevox_diagnostic", "message": "VOICEVOX event"}
    if http_error == null { .http_method = http.method; .http_status = to_int!(http.status) }
}
# Vector自身も同じ原本から一度だけ回収する。診断が原本を含んでも固定語彙以外を送らない。
if original.label."com.docker.compose.service" == "vector" {
    prefix, prefix_error = parse_regex(string!(original.message), r'^\S+\s+(?P<level>TRACE|DEBUG|INFO|WARN|ERROR)\b')
    if prefix_error == null { .level = downcase(string!(prefix.level)) }
    detail = downcase(string!(original.message))
    reason = "vector_event"
    if contains(detail, "configuration error") { reason = "configuration_failed" }
    else if contains(detail, "journalctl") { reason = "journal_input_event" }
    else if match(detail, r'request.*(failed|error)|retry|http.*[45][0-9]{2}') { reason = "delivery_failure" }
    else if contains(detail, "discard") { reason = "discarded" }
    else if match(detail, r'shut.*down|stopp') { reason = "stopped" }
    else if contains(detail, "started") { reason = "started" }
    . = {"timestamp": .timestamp, "observed_at": .observed_at, "host": .host,
         "project": .project, "service": "vector", "container_id": .container_id,
         "journal_cursor": .journal_cursor, "journal_boot_id": .journal_boot_id,
         "level": .level, "event": "vector_runtime", "reason": reason, "message": reason}
}
del(.label)
del(.host_key)
del(.source_type)
# 既知の要求全体・認証属性を中央へ複製しない。本文の出力制御は各サービスが担う。
. = map_values(., recursive: true) -> |value| {
    if is_object(value) {
        filter(object!(value)) -> |key, _value| { !match(key, r'(?i)(^request$|^headers$|authorization|token|password|secret|private_key)') }
    } else { value }
}
. = filter(.) -> |key, _value| { !match(key, r'(?i)(^request$|^headers$|authorization|token|password|secret|private_key)') }
.message = replace(string!(.message), r'(?i)bearer\s+[A-Za-z0-9._~+/=-]+', "Bearer [REDACTED]")
'''

[sinks.central]
type = "http"
inputs = ["normalize"]
uri = "http://log-router:8080/insert/jsonline?_time_field=timestamp&_msg_field=message&_stream_fields=host,project,service"
method = "post"
encoding.codec = "json"
framing.method = "newline_delimited"
compression = "gzip"
# 中央不在でも収集プロセスを起動し、HTTPの失敗は既存の再試行へ返す。
healthcheck.enabled = false
# 中央受理までcursor確定を待ち、同期前の停止では残存原本から再読取する。
acknowledgements.enabled = true
batch.timeout_secs = 1
buffer.type = "disk"
buffer.max_size = 268435488
buffer.when_full = "block"
request.headers.Content-Type = "application/stream+json"

[sinks.metrics_export]
type = "prometheus_exporter"
inputs = ["metrics"]
address = "0.0.0.0:9598"
