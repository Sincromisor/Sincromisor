<!DOCTYPE html>
<html lang="ja">

<head>
    <title>Sincromisor</title>
    <meta charset="UTF-8">
    <link href="styles/fonts.css" rel="stylesheet">
    <link href="styles/uiFoundation.css" rel="stylesheet">
    <link href="styles/common.css" rel="stylesheet">
    <link href="styles/sincroHeaderBox.css" rel="stylesheet">
    <link href="styles/index.css" rel="stylesheet">
</head>

<body class="sincroPage sincroPage--legacyCentered">
    <div id="sincroBody">
        <div id="sincroHeaderContainer">
            <div id="sincroHeaderBox">
                <div class="headerIconBox leftIconBox">
                    <img class="headerIconBox__icon" src="../images/icon-system.webp">
                </div>
                <div id="sincroHeaderBox__leftDecoration"></div>
                <div id="sincroHeaderBox__text">Sincromisor</div>
                <div id="sincroHeaderBox__rightDecoration"></div>
                <div class="headerIconBox rightIconBox">
                </div>
            </div>
        </div>

        <div class="sincroIndexContainer">
            <form class="sincroLinkBox">
                <h2>Recommended (VRM 1.0)</h2>
                <button formaction="simple-vrm/">Simple Interface (VRM 1.0)</button>
                <button formaction="vrm360/" class="experimental">360deg Camera (VRM 1.0)</button>
            </form>

            <form class="sincroLinkBox">
                <h2>Looking Glass (VRM 1.0 Priority)</h2>
                <button formaction="looking-glass-vrm/" class="experimental">Looking Glass (VRM 1.0 / Three.js)</button>
                <p>Experimental route (VRM 1.0 / Three.js migration target). It may not work yet depending on environment/device.</p>
            </form>

            <div>
                <h2>Source Code</h2>
                <p><a href="https://github.com/Sincromisor/Sincromisor">
                        https://github.com/Sincromisor/Sincromisor</a></p>
            </div>
        </div>

    </div>
</body>

</html>
