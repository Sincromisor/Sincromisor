<div id="sincroBody">
    <div id="sincroHeaderContainer">
        <div id="sincroHeaderBox">
            <div class="headerIconBox leftIconBox">
                <img class="headerIconBox__icon" src="../images/icon-system.webp">
            </div>
            <div id="sincroHeaderBox__leftDecoration"></div>
            <div id="sincroHeaderBox__text">Sincromisor</div>
            <div id="sincroHeaderBox__rightDecoration"></div>
            <div class="headerIconBox rightIconBox">
                <div id="debugMenu">
                    <button id="debugMenuButton" type="button" aria-label="Open debug menu" aria-expanded="false" aria-controls="debugMenuPanel">
                        <svg class="debugMenuButton__icon" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M19.43 12.98c.04-.32.07-.65.07-.98s-.03-.66-.08-.98l2.11-1.65a.5.5 0 0 0 .12-.64l-2-3.46a.5.5 0 0 0-.6-.22l-2.49 1a7.32 7.32 0 0 0-1.69-.98l-.38-2.65A.5.5 0 0 0 14 2h-4a.5.5 0 0 0-.49.42L9.13 5.07c-.62.23-1.2.55-1.73.95l-2.44-.98a.5.5 0 0 0-.61.22l-2 3.46a.5.5 0 0 0 .12.64L4.57 11c-.05.33-.07.66-.07 1s.02.67.07 1l-2.1 1.64a.5.5 0 0 0-.12.64l2 3.46a.5.5 0 0 0 .61.22l2.44-.98c.53.4 1.11.72 1.73.95l.38 2.65A.5.5 0 0 0 10 22h4a.5.5 0 0 0 .49-.42l.38-2.65c.61-.23 1.19-.55 1.72-.95l2.45.98a.5.5 0 0 0 .6-.22l2-3.46a.5.5 0 0 0-.12-.64L19.43 13zM12 15.5A3.5 3.5 0 1 1 12 8a3.5 3.5 0 0 1 0 7.5z" />
                        </svg>
                    </button>
                    <div id="debugMenuPanel" role="menu" aria-hidden="true">
                        <button id="debugConsoleToggle" type="button" role="menuitem">Debug Console</button>
                        <button id="reactSettingsPanelToggle" type="button" role="menuitem">設定パネル</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="sincroVideoContainer">
        <div id="sincroVideoBox1">
            Video1です。
            1600x900
        </div>
        <div id="sincroVideoBox2">
            Video2です。
            1600x900
        </div>
    </div>

    <div id="sincroChatContainer">
        <div id="sincroChatBox">
        </div>
    </div>

    <div id="sincroCharacterContainer">
        <div id="sincroCharacterBox">
            <canvas id="sincroCharacterBox__canvas"></canvas>
        </div>
    </div>

    <div id="sincroBackgroundContainer">
        <div id="sincroBackgroundBox">
        </div>
    </div>

    <div id="sincroFooterContainer">
        <div id="sincroFooterBox">
        </div>
    </div>

    <div id="sincroDebugConsoleContainer">
        {{> debugConsole}}
    </div>

    <div id="sincroReactSettingsPanelContainer">
        <div id="reactSettingsPanel">
            <button id="reactSettingsPanelClose" type="button" aria-label="Close settings panel">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M18.3 6.7a1 1 0 0 0-1.4 0L12 11.6 7.1 6.7a1 1 0 1 0-1.4 1.4l4.9 4.9-4.9 4.9a1 1 0 1 0 1.4 1.4l4.9-4.9 4.9 4.9a1 1 0 0 0 1.4-1.4l-4.9-4.9 4.9-4.9a1 1 0 0 0 0-1.4z" />
                </svg>
            </button>
            <div id="sincroReactSettingsPanelRoot"></div>
        </div>
    </div>

    <div id="sincroPopContainer">
        <div id="sincroPopBox">
        </div>
    </div>
</div>
