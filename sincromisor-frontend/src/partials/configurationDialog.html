<dialog id="configurationDialog">
    <div id="sincroDialogPopContainer">
        <div id="sincroDialogPopBox">
        </div>
    </div>
    <button id="sincroStart">はじめる</button>

    <fieldset>
        <legend>詳細設定</legend>
        <label class='fieldLabel' for="talkModeSelector">おはなしモード</label>
        <select class='fieldContent' name="talkMode" id="talkModeSelector">
            <option value="chat" selected>チャット</option>
            <option value="sincro">シンクロ</option>
        </select>

        <label class='fieldLabel' for="enableCharacter">キャラクターを表示する</label>
        <input class='fieldContent' type="checkbox" id="enableCharacter" name="enableCharacter" checked disabled />

        <label class='fieldLabel' for="enableCharacterGaze">顔認識機能を利用する<br>(Webカメラが必要です)</label>
        <input class='fieldContent' type="checkbox" id="enableCharacterGaze" name="enableCharacterGaze" checked
            disabled />

        <label class='fieldLabel' for="enableAutoMute">顔認識時のみ応答する<br>(Webカメラが必要です)</label>
        <input class='fieldContent' type="checkbox" id="enableAutoMute" name="enableAutoMute" checked disabled />

        <label class='fieldLabel' for="titleText">タイトル</label>
        <input class='fieldContent' type="text" id="titleText" name="titleText" placeholder="ここにタイトルを入力" />

        <details class="advancedSettings">
            <!-- フロント収音品質の切り分け用。端末/環境別にWebRTC前段の音声処理を切り替えられる。 -->
            <summary>高度なマイク設定</summary>
            <div class="advancedSettings__grid">
                <label class='fieldLabel' for="enableNoiseSuppression">ノイズ抑制を有効化する</label>
                <input class='fieldContent' type="checkbox" id="enableNoiseSuppression" name="enableNoiseSuppression"
                    checked />

                <label class='fieldLabel' for="enableEchoCancellation">エコーキャンセルを有効化する</label>
                <input class='fieldContent' type="checkbox" id="enableEchoCancellation" name="enableEchoCancellation"
                    checked />

                <label class='fieldLabel' for="enableAutoGainControl">マイク自動音量調整を有効化する<br>(騒音環境では無効推奨)</label>
                <input class='fieldContent' type="checkbox" id="enableAutoGainControl" name="enableAutoGainControl" />

                <label class='fieldLabel' for="enableVadGate">VADで無音時の送信を抑制する<br>(実験的機能)</label>
                <input class='fieldContent' type="checkbox" id="enableVadGate" name="enableVadGate" checked />
            </div>
        </details>
    </fieldset>
    <fieldset>
        <legend>VRMモデル</legend>
        <label class="fieldLabel" for="vrmFileInput">VRM-1.0モデル<br>(ここにドラッグ&ドロップ)</label>
        <input class='fieldContent' type="file" id="vrmFileInput" accept=".vrm">
    </fieldset>
    <p class="configurationDialog__back"><a href="/">&lt;&lt; もどる</a></p>
</dialog>
