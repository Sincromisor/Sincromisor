[project]
name = "sincro-config"
version = "2.0.0"
description = "Sincromisor configuration loader"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyyaml>=6.0.2",
    "pydantic>=2.11.7",
    "redis[hiredis]>=6.4.0",
    "py-consul>=1.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sincro_config"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
