[project]
name = "sincro-config"
version = "2.0.0"
description = "Sincromisor configuration loader"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "pyyaml>=6.0.3",
    "pydantic>=2.13.5",
    "redis[hiredis]>=8.1.0",
    "py-consul>=1.7.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sincro_config"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
