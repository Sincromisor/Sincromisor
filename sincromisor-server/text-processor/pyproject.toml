[project]
name = "text-processor"
version = "2.0.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "sincro-config",
    "sincro-models",
    "sudachipy>=0.6.11",
    "sudachidict-full>=20260723",
    "requests>=2.34.2",
    "aiohttp>=3.14.3",
    "pydantic>=2.13.5",
    "uvicorn>=0.52.4",
    "fastapi>=0.141.1",
    "websockets>=17.1",
    "setproctitle>=1.3.7",
]

[tool.uv.sources]
sincro-config = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/text_processor"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
