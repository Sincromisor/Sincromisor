[project]
name = "text-processor"
version = "2.0.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "sincro-config",
    "sincro-models",
    "sudachipy>=0.7.0",
    "sudachidict-full>=20260723.1",
    "requests>=2.34.2",
    "aiohttp>=3.14.5",
    "pydantic>=2.14.0",
    "uvicorn>=0.54.0",
    "fastapi>=0.143.0",
    "websockets>=17.2",
    "setproctitle>=1.3.8",
]

[tool.uv.sources]
sincro-config = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/text_processor"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
