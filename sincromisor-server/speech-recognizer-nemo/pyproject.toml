[project]
name = "speech-recognizer-nemo"
version = "2.0.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "sincro-config",
    "sincro-models",
    "pydantic>=2.11.7",
    "numpy==1.26.4",
    "uvicorn>=0.35.0",
    "fastapi>=0.116.1",
    "websockets>=15.0.1",
    "setproctitle>=1.3.6",
    "reazonspeech-nemo-asr",
    "boto3>=1.42.14",
    "onnx==1.18.0",
]

[tool.uv.sources]
reazonspeech-nemo-asr = { git = "https://github.com/reazon-research/ReazonSpeech.git", subdirectory = "pkg/nemo-asr" }
sincro-config = { workspace = true }
sincro-models = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/speech_recognizer_nemo"]

[tool.hatch.metadata]
allow-direct-references = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
