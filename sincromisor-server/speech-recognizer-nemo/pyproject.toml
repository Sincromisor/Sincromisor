[project]
name = "speech-recognizer-nemo"
version = "2.0.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "sincro-config",
    "sincro-models",
    "pydantic>=2.13.5",
    "numpy>=2.5.3,<3",
    "sudachipy>=0.6.11",
    "sudachidict-full>=20260723",
    "uvicorn>=0.52.4",
    "fastapi>=0.141.1",
    "websockets>=17.1",
    "setproctitle>=1.3.7",
    "reazonspeech-nemo-asr",
    "nemo-toolkit[asr]>=3.0.0,<4",
    "boto3>=1.43.93",
    "onnx>=1.22.0",
]

[tool.uv.sources]
reazonspeech-nemo-asr = { git = "https://github.com/reazon-research/ReazonSpeech.git", subdirectory = "pkg/nemo-asr" }
sincro-config = { workspace = true }
sincro-models = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/speech_recognizer_nemo"]

[tool.hatch.metadata]
allow-direct-references = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
