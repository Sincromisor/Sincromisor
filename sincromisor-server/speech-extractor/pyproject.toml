[project]
name = "speech-extractor"
version = "2.0.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "sincro-config",
    "sincro-models",
    "numpy>=2.5.3,<3",
    "mediapipe==1.0.1",
    "pydantic>=2.13.5",
    "uvicorn>=0.52.4",
    "fastapi>=0.141.1",
    "websockets>=17.1",
    "setproctitle>=1.3.7",
]

[tool.uv.sources]
sincro-config = { workspace = true }
sincro-models = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/speech_extractor"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
