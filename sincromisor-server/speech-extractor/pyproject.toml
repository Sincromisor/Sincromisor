[project]
name = "speech-extractor"
version = "2.0.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "sincro-config",
    "sincro-models",
    "numpy>=2.5.4,<3",
    "mediapipe>=1.1.1",
    "uvicorn>=0.54.0",
    "fastapi>=0.162.0",
    "websockets>=17.3",
    "setproctitle>=1.3.8",
]

[tool.uv.sources]
sincro-config = { workspace = true }
sincro-models = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/speech_extractor"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
