[project]
name = "sincro-models"
version = "2.0.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "sincro-config",
    "pydantic>=2.13.5",
    "msgpack>=1.2.2",
    "numpy>=2.5.3,<3",
    "python-ulid>=4.0.1",
]

[dependency-groups]
# `uv run --package sincro-models --group dev` は選択した workspace member の
# group を解決するため、既存 root virtualenv に依存しない検証 tool をここでも明示する。
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[tool.uv.sources]
sincro-config = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/sincro_models"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
