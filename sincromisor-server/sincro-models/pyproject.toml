[project]
name = "sincro-models"
version = "2.0.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "sincro-config",
    "pydantic>=2.11.7",
    "msgpack>=1.1.1",
    "numpy==1.26.4",
    "python-ulid>=3.1.0",
]

[dependency-groups]
# `uv run --package sincro-models --group dev` は選択した workspace member の
# group を解決するため、既存 root virtualenv に依存しない検証 tool をここでも明示する。
dev = [
    "pytest>=8.4.2",
    "ruff>=0.12.5",
]

[tool.uv.sources]
sincro-config = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/sincro_models"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
