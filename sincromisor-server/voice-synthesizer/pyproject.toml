[project]
name = "voice-synthesizer"
version = "2.0.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "sincro-config",
    "sincro-models",
    "redis[hiredis]>=8.1.0",
    "boto3>=1.43.93",
    "requests>=2.34.2",
    "pydantic>=2.13.5",
    "numpy>=2.5.3,<3",
    "uvicorn>=0.52.4",
    "fastapi>=0.141.1",
    "websockets>=17.1",
    "setproctitle>=1.3.7",
]

[tool.uv.sources]
sincro-config = { workspace = true }
sincro-models = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/voice_synthesizer"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
